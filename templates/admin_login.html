<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Admin Girişi</title>
    <style>
        body { font-family: system-ui; background: #1e3c72; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 2rem; border-radius: 20px; width: 300px; }
        input, button { width: 100%; padding: 0.5rem; margin-top: 0.5rem; }
        button { background: #1e3c72; color: white; border: none; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Admin Girişi</h2>
        <form method="POST">
            <label>Şifre</label>
            <input type="password" name="password" required>
            <button type="submit">Giriş Yap</button>
        </form>
    </div>
</body>
</html>
