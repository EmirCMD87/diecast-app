<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Üyelik - Diecast</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 2rem;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        h1 { color: #1e3c72; margin-bottom: 0.5rem; }
        .price { font-size: 2rem; font-weight: bold; color: #28a745; margin: 1rem 0; }
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }
        .feature {
            background: #f0f2f5;
            padding: 1rem;
            border-radius: 15px;
            text-align: center;
        }
        .btn {
            background: #f39c12;
            color: white;
            padding: 0.8rem 2rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background: #e67e22; }
        .note { margin-top: 2rem; font-size: 0.8rem; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Premium Üyelik</h1>
        <p>Sınırsız koleksiyon, reklamsız deneyim ve özel rozet.</p>
        <div class="price">$7 / ay (≈ 250 TL)</div>
        <div class="features">
            <div class="feature">♾️ Sınırsız araba ekleme</div>
            <div class="feature">⭐ Premium rozeti</div>
            <div class="feature">📊 Gelişmiş Excel raporu</div>
        </div>
        <button class="btn" onclick="bilgiAl()">💰 Premium'a Geç - Bilgi Al</button>
        <div class="note">
            Ödeme IBAN veya Papara ile alınır. Premium üyelik manuel olarak aktif edilir.<br>
            İletişim: <strong>hdirarin@gmail.com</strong>
        </div>
    </div>
    <script>
        function bilgiAl() {
            const mesaj = "Premium üyelik hakkında bilgi almak istiyorum.";
            window.open("https://wa.me/905551234567?text=" + encodeURIComponent(mesaj), '_blank');
        }
    </script>
</body>
</html>
