<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Araba Ekle - Diecast</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
        }
        h1 { text-align: center; color: #1e3c72; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 10px;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: #218838; }
        .link { text-align: center; margin-top: 1rem; }
        .link a { color: #1e3c72; text-decoration: none; }
        .flash { padding: 0.75rem; border-radius: 10px; margin-bottom: 1rem; }
        .flash.success { background: #d4edda; color: #155724; }
        .flash.danger { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>➕ Yeni Araba Ekle</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label>Araba İsmi</label>
                <input type="text" name="isim" required>
            </div>
            <div class="form-group">
                <label>Marka</label>
                <select name="marka" required>
                    <option value="">Seç</option>
                    <option value="Hot Wheels">🔥 Hot Wheels</option>
                    <option value="Matchbox">📦 Matchbox</option>
                    <option value="Diğer">🚗 Diğer</option>
                </select>
            </div>
            <div class="form-group">
                <label>Renk</label>
                <select name="renk" required>
                    <option value="">Seç</option>
                    <option value="Kırmızı">🔴 Kırmızı</option>
                    <option value="Mavi">🔵 Mavi</option>
                    <option value="Yeşil">🟢 Yeşil</option>
                    <option value="Siyah">⚫ Siyah</option>
                    <option value="Beyaz">⚪ Beyaz</option>
                    <option value="Sarı">🟡 Sarı</option>
                    <option value="Gümüş">🔘 Gümüş</option>
                </select>
            </div>
            <div class="form-group">
                <label>📏 Ölçek</label>
                <select name="olcek" required>
                    <option value="">Seç</option>
                    <option value="1:120">1:120</option>
                    <option value="1:100">1:100</option>
                    <option value="1:87 (HO)">1:87 (HO)</option>
                    <option value="1:72">1:72</option>
                    <option value="1:64 (Standart)">1:64 (Standart)</option>
                    <option value="1:55">1:55</option>
                    <option value="1:50">1:50</option>
                    <option value="1:43">1:43</option>
                    <option value="1:32">1:32</option>
                    <option value="1:24">1:24</option>
                    <option value="1:20">1:20</option>
                    <option value="1:18">1:18</option>
                    <option value="1:12">1:12</option>
                    <option value="1:1 (Gerçek boyut)">1:1 (Gerçek boyut)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Fotoğraf</label>
                <input type="file" name="resim" accept="image/*" required>
            </div>
            <button type="submit">💾 Kaydet</button>
        </form>
        <div class="link">
            <a href="{{ url_for('dashboard') }}">← Koleksiyonuma Dön</a>
        </div>
    </div>
</body>
</html>
